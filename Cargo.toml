[workspace]
members = ["src-tauri"]

[package]
name = "sundaytranslate-relay"
version = "0.2.0"
edition = "2021"
description = "On-LAN audio relay for SundayTranslate — bundles mediamtx (WHIP/WHEP) so interpretation audio stays on the church wifi, with Cloudflare SFU as fallback."
license = "MIT"

# A library (reused by the Tauri UI shell later) + a headless binary.
[lib]
name = "relay_core"
path = "src/lib.rs"

[[bin]]
name = "sundaytranslate-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs", "io-util", "sync"] }
# Kept in lockstep with the version tauri pulls in, so the build carries one
# reqwest/hyper/TLS stack rather than two. 0.13 renamed the old `rustls-tls`
# feature to `rustls` (aws-lc-rs provider + the OS trust store via
# rustls-platform-verifier, instead of bundled webpki roots).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
local-ip-address = "0.6"

# Only for `kill(pid, SIGTERM)` — tokio's `start_kill` is an unconditional
# SIGKILL, which gives mediamtx no chance to close its listeners.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `net` for the hand-rolled canned HTTP server the enroll/register tests use
# (a full mock-server crate would be far more dependency for less control).
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util"] }
tempfile = "3"
