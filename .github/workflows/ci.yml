# CI — format, lint and test gate for the Tauri relay (Rust). There is no JS
# test surface (package.json only wraps the tauri CLI), so the Rust checks are
# the meaningful gate.
#
# NOTE: the workspace root is the repo root (`src-tauri` is a *member*, not a
# workspace of its own), so every command runs workspace-wide from `.`. Testing
# only `src-tauri` used to mean testing the one package that has no tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # Pinned: the runner's preinstalled Rust floats, and with `-D warnings`
      # any newly-added clippy lint turns main red on its own. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # The mediamtx sidecar is now a real build input: tauri-build validates the
      # externalBin path while compiling the src-tauri crate, so even `cargo
      # clippy`/`test` fail without it. Fetch it (Linux host triple) before any
      # cargo command touches src-tauri.
      - name: Fetch mediamtx sidecar
        run: ./scripts/fetch-mediamtx.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
