# CI — format, lint and test gate for the Tauri relay (Rust). There is no JS
# test surface (package.json only wraps the tauri CLI), so the Rust checks are
# the meaningful gate.
#
# NOTE: the workspace root is the repo root (`src-tauri` is a *member*, not a
# workspace of its own), so every command runs workspace-wide from `.`. Testing
# only `src-tauri` used to mean testing the one package that has no tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
