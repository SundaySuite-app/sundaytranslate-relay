# Managed dependency updates. Weekly; minor/patch grouped to limit PR noise.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # Rust-versjonen står i selve action-referansen
      # (`dtolnay/rust-toolchain@1.98.0`) og løftes for hånd i rammeverk-rundene,
      # sammen med de andre Tauri-repoene. Action-repoet har tagger langt forbi
      # Rust-versjoner som finnes — #13 foreslo 1.120.0, som ikke kan installeres.
      - dependency-name: "dtolnay/rust-toolchain"
